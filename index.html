<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día de las Flores Amarillas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Caveat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #f1f1f1;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .title-font {
            font-family: 'Cinzel', serif;
        }
        .cursive-font {
            font-family: 'Caveat', cursive;
        }
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
        .glow-button {
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.2);
        }
        .glow-button:hover {
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.5);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative p-4 md:p-8 select-none">

    <canvas id="bgCanvas"></canvas>

    <main class="relative z-10 max-w-6xl w-full grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-12 items-center justify-center my-auto">
        
        <!-- Left Side: Romantic Text Card -->
        <section class="flex flex-col justify-center space-y-6 bg-neutral-900/70 backdrop-blur-md p-6 sm:p-10 rounded-3xl border border-yellow-500/20 shadow-2xl">
            
            <header>
                <h1 class="title-font text-xl sm:text-2xl lg:text-3xl font-bold text-yellow-400 tracking-wider leading-relaxed flex items-center gap-2 flex-wrap">
                    <span>🌻</span>
                    <span>FELIZ DÍA DE LAS FLORES AMARILLAS</span>
                    <span>🌻</span>
                </h1>
            </header>

            <article class="space-y-4 title-font text-sm sm:text-base text-neutral-200 leading-relaxed tracking-wide font-semibold">
                <p>
                    FLORES AMARILLAS PARA LA PERSONA QUE HACE QUE TODO SEA UN POQUITO MÁS BRILLANTE,
                </p>
                <p>
                    ESPERO QUE TE SAQUEN UNA SONRISA.
                </p>
                <p>
                    QUE ESTAS FLORES TE RECUERDEN LO ESPECIAL QUE ERES.
                </p>
                <p class="text-yellow-400 pt-2 font-bold text-lg sm:text-xl">
                    - ¡TE QUIERO!
                </p>
            </article>

            <hr class="border-neutral-800 my-2">

            <div>
                <p class="cursive-font text-2xl sm:text-3xl text-yellow-300 font-medium tracking-wide">
                    Eres el sol que quisiera que floreciera cada uno de mis días. 🌻
                </p>
            </div>

            <div class="pt-2">
                <button id="rebloomBtn" class="glow-button px-6 py-3 rounded-full border border-yellow-500/50 bg-neutral-900/90 hover:bg-yellow-500/20 text-yellow-400 font-medium text-sm sm:text-base flex items-center gap-2 cursor-pointer transition-all">
                    <span>✨</span>
                    <span>Florecer de nuevo</span>
                </button>
            </div>

        </section>

        <!-- Right Side: Heart Tree Canvas -->
        <section class="flex flex-col items-center justify-center w-full min-h-[420px] sm:min-h-[520px] relative">
            <canvas id="treeCanvas" class="w-full max-w-[480px] h-[450px] sm:h-[520px] object-contain"></canvas>
        </section>

    </main>

    <script>
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');

        let bgWidth, bgHeight;
        const fallingItems = [];
        const TOTAL_FALLING = 22;

        function resizeBgCanvas() {
            bgWidth = bgCanvas.width = window.innerWidth;
            bgHeight = bgCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeBgCanvas);
        resizeBgCanvas();

        function drawBackgroundItem(ctx, x, y, size, rotation, opacity, isPetal) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            ctx.globalAlpha = opacity;

            if (isPetal) {
                ctx.fillStyle = '#FACC15';
                ctx.beginPath();
                ctx.ellipse(0, 0, size * 0.4, size * 0.9, Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();
            } else {
                const petals = 10;
                ctx.fillStyle = '#EAB308';
                for (let i = 0; i < petals; i++) {
                    ctx.rotate((Math.PI * 2) / petals);
                    ctx.beginPath();
                    ctx.ellipse(0, size * 0.5, size * 0.18, size * 0.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = '#451a03';
                ctx.beginPath();
                ctx.arc(0, 0, size * 0.38, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        class FallingPetal {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * bgWidth;
                this.y = initial ? Math.random() * bgHeight : -30;
                this.size = Math.random() * 8 + 8;
                this.speedY = Math.random() * 0.8 + 0.5;
                this.speedX = Math.sin(Math.random() * Math.PI) * 0.3;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.02;
                this.opacity = Math.random() * 0.4 + 0.2;
                this.swingAngle = Math.random() * Math.PI * 2;
                this.swingSpeed = Math.random() * 0.02 + 0.008;
                this.isPetal = Math.random() > 0.4;
            }

            update() {
                this.y += this.speedY;
                this.swingAngle += this.swingSpeed;
                this.x += Math.sin(this.swingAngle) * 0.6 + this.speedX;
                this.rotation += this.rotSpeed;

                if (this.y > bgHeight + 30 || this.x < -30 || this.x > bgWidth + 30) {
                    this.reset();
                }
            }

            draw() {
                drawBackgroundItem(bgCtx, this.x, this.y, this.size, this.rotation, this.opacity, this.isPetal);
            }
        }

        for (let i = 0; i < TOTAL_FALLING; i++) {
            fallingItems.push(new FallingPetal());
        }

        function animateBg() {
            bgCtx.clearRect(0, 0, bgWidth, bgHeight);
            fallingItems.forEach(item => {
                item.update();
                item.draw();
            });
            requestAnimationFrame(animateBg);
        }
        animateBg();

        const treeCanvas = document.getElementById('treeCanvas');
        const treeCtx = treeCanvas.getContext('2d');

        let flowers = [];
        let animationFrameId;
        let bloomStartTime = 0;

        function initTreeCanvas() {
            treeCanvas.width = 480 * window.devicePixelRatio;
            treeCanvas.height = 520 * window.devicePixelRatio;
            treeCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        initTreeCanvas();

        function isInHeart(x, y) {
            // Normalized coordinates around heart center
            const nx = x / 12.5;
            const ny = -y / 12.5;
            return (Math.pow(nx * nx + ny * ny - 1, 3) - nx * nx * Math.pow(ny, 3)) <= 0;
        }

        function generateSeamlessHeart() {
            flowers = [];
            const centerX = 240;
            const centerY = 195;
            const scale = 12.5;
            
            // Flower radius tuned to slightly overlap neighbors and erase gaps cleanly
            const flowerSize = 22; 
            const spacing = 19; // Uniform grid spacing for clean structure

            for (let y = -15; y <= 15; y += 1.4) {
                for (let x = -15; x <= 15; x += 1.4) {
                    // Slight stagger on alternate rows for organic interlocking
                    const xOffset = (Math.round(y * 10) % 2 === 0) ? 0 : 0.7;
                    const sampleX = x + xOffset;
                    const sampleY = y;

                    if (isInHeart(sampleX, sampleY)) {
                        const px = centerX + sampleX * (spacing * 0.68);
                        const py = centerY + sampleY * (spacing * 0.68);
                        const distFromCenter = Math.hypot(px - centerX, py - centerY);

                        flowers.push({
                            x: px,
                            y: py,
                            maxSize: flowerSize,
                            delay: distFromCenter * 8 + Math.random() * 180,
                            rotation: Math.random() * Math.PI * 2,
                            petals: 14
                        });
                    }
                }
            }

            // Boundary ring to ensure crisp heart outline
            for (let t = 0; t < Math.PI * 2; t += 0.09) {
                const hx = 16 * Math.pow(Math.sin(t), 3);
                const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                const px = centerX + hx * (scale * 0.95);
                const py = centerY + hy * (scale * 0.95);

                const distFromCenter = Math.hypot(px - centerX, py - centerY);

                flowers.push({
                    x: px,
                    y: py,
                    maxSize: flowerSize * 0.95,
                    delay: distFromCenter * 8 + Math.random() * 120,
                    rotation: Math.random() * Math.PI * 2,
                    petals: 14
                });
            }

            flowers.sort((a, b) => a.delay - b.delay);
        }

        function drawStemAndBase() {
            treeCtx.save();

            // Trunk / Stem
            const gradient = treeCtx.createLinearGradient(230, 300, 250, 450);
            gradient.addColorStop(0, '#16a34a');
            gradient.addColorStop(1, '#14532d');
            
            treeCtx.fillStyle = gradient;
            treeCtx.beginPath();
            treeCtx.moveTo(234, 300);
            treeCtx.lineTo(246, 300);
            treeCtx.lineTo(249, 440);
            treeCtx.lineTo(231, 440);
            treeCtx.closePath();
            treeCtx.fill();

            // Leaves
            treeCtx.fillStyle = '#15803d';
            treeCtx.beginPath();
            treeCtx.ellipse(218, 365, 24, 11, -Math.PI / 4, 0, Math.PI * 2);
            treeCtx.fill();

            treeCtx.beginPath();
            treeCtx.ellipse(262, 385, 24, 11, Math.PI / 4, 0, Math.PI * 2);
            treeCtx.fill();

            // Base Stand / Pot
            treeCtx.fillStyle = '#064e3b';
            treeCtx.beginPath();
            treeCtx.roundRect(215, 435, 50, 14, 5);
            treeCtx.fill();

            treeCtx.restore();
        }

        function drawSunflower(x, y, size, rotation, petalsCount) {
            treeCtx.save();
            treeCtx.translate(x, y);
            treeCtx.rotate(rotation);

            const petalLength = size;
            const petalWidth = size * 0.42;

            // Outer Petals
            treeCtx.fillStyle = '#FACC15';
            for (let i = 0; i < petalsCount; i++) {
                treeCtx.rotate((Math.PI * 2) / petalsCount);
                treeCtx.beginPath();
                treeCtx.ellipse(0, petalLength / 2, petalWidth / 2, petalLength / 2, 0, 0, Math.PI * 2);
                treeCtx.fill();
            }

            // Inner Petal Highlights
            treeCtx.fillStyle = '#EAB308';
            treeCtx.rotate(Math.PI / petalsCount);
            for (let i = 0; i < petalsCount; i++) {
                treeCtx.rotate((Math.PI * 2) / petalsCount);
                treeCtx.beginPath();
                treeCtx.ellipse(0, (petalLength * 0.8) / 2, petalWidth * 0.4, (petalLength * 0.8) / 2, 0, 0, Math.PI * 2);
                treeCtx.fill();
            }

            // Dark Center Seed Head
            treeCtx.fillStyle = '#3b1a0e';
            treeCtx.beginPath();
            treeCtx.arc(0, 0, size * 0.36, 0, Math.PI * 2);
            treeCtx.fill();

            treeCtx.fillStyle = '#78350f';
            treeCtx.beginPath();
            treeCtx.arc(0, 0, size * 0.22, 0, Math.PI * 2);
            treeCtx.fill();

            treeCtx.restore();
        }

        function animateHeartTree(timestamp) {
            if (!bloomStartTime) bloomStartTime = timestamp;
            const elapsed = timestamp - bloomStartTime;

            treeCtx.clearRect(0, 0, 480, 520);

            drawStemAndBase();

            let allFinished = true;

            for (let i = 0; i < flowers.length; i++) {
                const flower = flowers[i];

                if (elapsed > flower.delay) {
                    const flowerAge = elapsed - flower.delay;
                    const duration = 300;
                    
                    let progress = Math.min(flowerAge / duration, 1);
                    const scaleProgress = 1 - Math.pow(1 - progress, 3);
                    
                    const currentSize = flower.maxSize * scaleProgress;

                    drawSunflower(flower.x, flower.y, currentSize, flower.rotation, flower.petals);

                    if (progress < 1) allFinished = false;
                } else {
                    allFinished = false;
                }
            }

            if (!allFinished) {
                animationFrameId = requestAnimationFrame(animateHeartTree);
            }
        }

        function startBlooming() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            generateSeamlessHeart();
            bloomStartTime = 0;
            animationFrameId = requestAnimationFrame(animateHeartTree);
        }

        document.getElementById('rebloomBtn').addEventListener('click', () => {
            startBlooming();
        });

        window.addEventListener('load', () => {
            startBlooming();
        });

        window.addEventListener('resize', () => {
            initTreeCanvas();
            startBlooming();
        });
    </script>
</body>
</html>
