<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Día de las Flores Amarillas 🌻</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Caveat:wght@600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f7f5ed;
      color: #2b2b2b;
      font-family: 'Cinzel', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 20px;
    }

    /* Contenedor principal responsive */
    .container {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      max-width: 1100px;
      width: 100%;
      background-color: #f7f5ed;
      padding: 40px;
      gap: 30px;
    }

    /* Lado Izquierdo: Mensaje Poético */
    .text-column {
      flex: 1;
      max-width: 500px;
      text-align: left;
      z-index: 2;
    }

    .title-header {
      font-size: 1.3rem;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: 1px;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .poem-text {
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      line-height: 2.1;
      font-weight: 600;
      color: #222;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 25px;
    }

    .signature {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 35px;
      color: #000;
    }

    .sub-quote {
      font-family: 'Caveat', cursive;
      font-size: 1.8rem;
      color: #1a1a1a;
      text-transform: none;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid rgba(0, 0, 0, 0.15);
      padding-top: 15px;
      margin-top: 10px;
    }

    /* Lado Derecho: Canvas del Árbol Corazón */
    .tree-column {
      flex: 1.2;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    #heartTreeCanvas {
      width: 100%;
      max-width: 550px;
      height: auto;
      aspect-ratio: 1 / 1;
    }

    /* Botón de reinicio de animación sutil */
    .replay-btn {
      margin-top: 20px;
      background: transparent;
      border: 1px solid #d4a373;
      color: #8b5e34;
      padding: 8px 18px;
      border-radius: 20px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .replay-btn:hover {
      background: #faedcd;
      color: #d4a373;
    }

    /* Adaptación a dispositivos móviles */
    @media (max-width: 850px) {
      .container {
        flex-direction: column-reverse;
        padding: 20px 10px;
        text-align: center;
      }

      .text-column {
        text-align: center;
        max-width: 100%;
      }

      .title-header {
        justify-content: center;
      }

      .sub-quote {
        justify-content: center;
      }

      .poem-text {
        font-size: 0.95rem;
        line-height: 1.9;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Lado Izquierdo: Texto y Poema -->
    <div class="text-column">
      <div class="title-header">
        🌻 FELIZ DÍA DE LAS FLORES AMARILLAS 🌻
      </div>

      <div class="poem-text">
        Flores amarillas para la persona que hace que todo sea un poquito más brillante,<br>
        Espero que te saquen una sonrisa.<br>
        QUE ESTAS FLORES TE RECUERDEN LO ESPECIAL QUE ERES PARA MÍ.
      </div>

      <div class="signature">
        - ¡TE QUIERO!
      </div>

      <div class="sub-quote">
        Eres el sol que hace florecer cada uno de mis días. 🌻
      </div>

      <div>
        <button class="replay-btn" onclick="initHeartTree()">
          ✨ Florecer de nuevo
        </button>
      </div>
    </div>

    <!-- Lado Derecho: Árbol en forma de Corazón con Girasoles -->
    <div class="tree-column">
      <canvas id="heartTreeCanvas" width="600" height="600"></canvas>
    </div>

  </div>

  <script>
    const canvas = document.getElementById('heartTreeCanvas');
    const ctx = canvas.getContext('2d');

    let sunflowers = [];
    let trunkProgress = 0;
    let animationFrameId;

    // Fórmula paramétrica del corazón
    function getHeartPoint(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x, y };
    }

    // Generador de flores rellenando la forma de corazón
    function generateHeartSunflowers(count) {
      const flowers = [];
      let i = 0;

      while (i < count) {
        // Generar punto aleatorio dentro del área
        const t = Math.random() * Math.PI * 2;
        const scale = Math.random(); // Distribución dentro del perímetro
        
        const point = getHeartPoint(t);
        
        // Coordenadas ajustadas al Canvas
        const x = 300 + point.x * 14 * Math.sqrt(scale);
        const y = 230 + point.y * 14 * Math.sqrt(scale);

        // Tamaño del girasol aleatorio pero balanceado
        const radius = Math.random() * 6 + 7;
        const delay = Math.random() * 100; // Retraso de aparición gradual

        flowers.push({
          x, y, radius, delay,
          currentScale: 0,
          rotation: Math.random() * Math.PI * 2
        });

        i++;
      }
      return flowers;
    }

    // Dibujar Tronco del Árbol
    function drawTrunk(progress) {
      ctx.save();
      
      // Suelo / Base
      ctx.beginPath();
      ctx.moveTo(100, 520);
      ctx.lineTo(500, 520);
      ctx.strokeStyle = '#1e3d34';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Tronco Principal (Verde Oscuro elegante como en la foto)
      ctx.fillStyle = '#1e4d40';
      
      const currentHeight = 220 * progress;
      
      ctx.beginPath();
      ctx.moveTo(280, 520);
      ctx.lineTo(320, 520);
      ctx.lineTo(312, 520 - currentHeight);
      ctx.lineTo(288, 520 - currentHeight);
      ctx.closePath();
      ctx.fill();

      // Maceta/Base cilíndrica bonita
      if (progress > 0.5) {
        ctx.fillStyle = '#1e4d40';
        ctx.beginPath();
        ctx.roundRect(275, 500, 50, 20, 4);
        ctx.fill();
      }

      ctx.restore();
    }

    // Dibujar un Girasol individual
    function drawSunflower(x, y, radius, scale, rotation) {
      if (scale <= 0) return;

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.scale(scale, scale);

      // Pétalos Amarillos
      const petalCount = 12;
      ctx.fillStyle = '#ffcc00';
      
      for (let i = 0; i < petalCount; i++) {
        ctx.rotate((Math.PI * 2) / petalCount);
        ctx.beginPath();
        ctx.ellipse(0, radius * 1.1, radius * 0.4, radius * 0.9, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Capa de Pétalos Dorados Interiores
      ctx.fillStyle = '#ffa700';
      for (let i = 0; i < petalCount; i++) {
        ctx.rotate((Math.PI * 2) / petalCount);
        ctx.beginPath();
        ctx.ellipse(0, radius * 0.8, radius * 0.3, radius * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Centro Oscuro/Marrón del Girasol
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.55, 0, Math.PI * 2);
      ctx.fillStyle = '#3a1e05';
      ctx.fill();

      // Detalle del centro
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = '#241303';
      ctx.fill();

      ctx.restore();
    }

    // Bucle de Animación
    let frame = 0;

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Crecimiento del tronco
      if (trunkProgress < 1) {
        trunkProgress += 0.03;
      }

      drawTrunk(Math.min(trunkProgress, 1));

      // 2. Aparición de las flores en el corazón
      if (trunkProgress > 0.4) {
        frame++;
        let completed = true;

        sunflowers.forEach(flower => {
          if (frame > flower.delay) {
            if (flower.currentScale < 1) {
              flower.currentScale += 0.05;
              completed = false;
            }
          } else {
            completed = false;
          }

          drawSunflower(
            flower.x, 
            flower.y, 
            flower.radius, 
            Math.min(flower.currentScale, 1), 
            flower.rotation
          );
        });
      }

      animationFrameId = requestAnimationFrame(animate);
    }

    // Inicializar / Reiniciar Animación
    function initHeartTree() {
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
      }
      trunkProgress = 0;
      frame = 0;
      sunflowers = generateHeartSunflowers(320); // 320 girasoles forman la copa
      animate();
    }

    // Arrancar automáticamente al cargar
    window.onload = () => {
      initHeartTree();
    };
  </script>
</body>
</html>
